<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="card" width="1080" height="600" viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
  // Test page: exposes engine.js as window.E once the bundled font is loaded.
  import * as E from './engine.js';
  const face = new FontFace('InterV', 'url(/fonts/InterVariable.woff2)', { weight: '100 900' });
  document.fonts.add(await face.load());
  window.E = E;
  window.ENGINE_LOADED = true;
</script>
</body>
</html>
